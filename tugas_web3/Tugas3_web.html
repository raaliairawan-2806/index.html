<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas Web 3</title>
</head>
<body>
    <form action="#" method="post">
        <table border="1" cellspacing="2" cellpadding="0" bgcolor="#00FFFF" width="490" align="center">      
            <tr>
                <td colspan="3"> 
                    <h3 style="font-size: 21px;">Isi Form Registrasi Berikut</h3>
                
                </td>
            </tr>
            <tr>
                
                <td width="24%" align="left"><label for="nama_depan">Nama Depan</label></td>
                <td align="center">:</td>
                <td><input type="text" name="nama_depan" id="nama_depan" style="width: 85%;"></td>
            </tr>
            <tr>
                <td width="24%" align="left"><label for="nama_belakang">Nama Belakang</label></td>
                <td align="center">:</td>
                <td><input type="text" name="nama_belakang" id="nama_belakang" style="width: 85%;"></td>
            </tr>
            <tr>
                <td width="24%" align="left"><label for="tanggal_lahir">Tanggal Lahir</label></td>
                <td align="center">:</td>
                <td><input type="date" name="tanggal_lahir" id="tanggal_lahir"></td>
            </tr>
            <tr>
                <td width="24%" align="left">Jenis Kelamin</td>
                <td align="center">:</td>
                <td>
                    <input type="radio" name="jenis_kelamin" id="laki_laki" value="Laki-Laki">
                    <label for="laki_laki">Laki-Laki</label>
                    <input type="radio" name="jenis_kelamin" id="perempuan" value="Perempuan" checked>
                    <label for="perempuan">Perempuan</label>
                </td>
            </tr>
            <tr>
                <td width="24%" align="left"><label for="semester">Semester</label></td>
                <td align="center">:</td>
                <td>
                    <select name="semester" id="semester">
                        <option value="">Pilih Semester</option>
                        <option value="1">Semester 1</option>
                        <option value="2">Semester 2</option>
                        <option value="3">Semester 3</option>
                        <option value="4">Semester 4</option>
                        <option value="5">Semester 5</option>
                        <option value="6">Semester 6</option>
                        <option value="7">Semester 7</option>
                        <option value="8">Semester 8</option>s
                    </select>
                </td>
            </tr>
            <tr>
                <td width="24%" align="left"><label for="alamat">Alamat</label></td>
                <td align="center">:</td>
                <td><textarea name="alamat" id="alamat" cols="20" rows="4" style="width: 80%;"></textarea></td>
            </tr>
            <tr>
                <td colspan="3" align="center">
                    <button type="submit">Daftar</button>
                    <button type="reset">Batal</button>
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
